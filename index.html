<!DOCTYPE html>

    <title>Welcome</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);

            margin: 0;
            display: flex;
            justify-content: center;

            color: #333;
