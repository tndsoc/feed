name: Deploy Feed to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Copy newfile to feed.txt
        run: |
          if [ -f "newfile" ]; then
            cp newfile feed.txt
          else
            echo "Error: newfile not found!" >&2
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: '.'

      - name: Check uploaded artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Artifact ID: ${{ steps.upload.outputs.artifact_id }}"
          gh api \
            repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts \
            --jq '{total_count, artifacts: [.artifacts[] | {id, name, expired}]}'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
